pipeline:
  name: ci-demo
  description: Continuous integration pipeline for demo

stages:
  - build
  - test
  - package

install:
  stage: build
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov

verify:
  stage: build
  image: python:3.11-slim
  needs: [install]
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest tests/ --collect-only
    - echo "Verified test collection"

unit-tests:
  stage: test
  image: python:3.11-slim
  script:
    - pip install pytest
    - pip install -r requirements.txt
    - pytest tests/ -v

coverage:
  stage: test
  image: python:3.11-slim
  needs: [unit-tests]
  script:
    - pip install pytest pytest-cov
    - pip install -r requirements.txt
    - pytest tests/ --cov=src --cov-report=term-missing
  artifacts:
    - coverage.xml

package:
  stage: package
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python -m py_compile src/main.py
    - echo "Package verification complete"
